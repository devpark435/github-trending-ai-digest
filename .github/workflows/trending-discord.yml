name: trending-discord

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 KST 08:00 (UTC 23:00)
  workflow_dispatch: {}      # 수동 테스트용

permissions:
  contents: write            # 스냅샷 커밋

concurrency:
  group: trending-discord
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Fetch trending + post Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/trending-discord.mjs

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trending/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: trending snapshot $(date -u +%F)"
            git push
          fi
